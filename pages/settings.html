      <div class="page-header"><h1>Settings</h1></div>
      <div class="card-app mb-3">
        <div class="card-body">
          <h6 class="fw-bold mb-3">Appearance</h6>
          <div class="d-flex gap-2">
            <button class="btn-outline-app" onclick="Theme.set('light')">Light</button>
            <button class="btn-outline-app" onclick="Theme.set('dark')">Dark</button>
            <button class="btn-outline-app" onclick="Theme.set('system')">System</button>
          </div>
        </div>
      </div>
      <div class="card-app">
        <div class="card-body">
          <h6 class="fw-bold mb-3">App Language</h6>
          <select class="form-select form-control-app">
            <option>English</option>
            <option>Hindi</option>
            <option>Marathi</option>
          </select>
          <p class="text-muted small mt-2 mb-0">Interview language can be chosen separately when starting a mock interview.</p>
        </div>
      </div>
    </div>
