<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../assets/js/safe-html.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2B5748">
  <title>Resume Analysis — MockMaster</title>
  <link href="../../vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
  <link href="../../vendor/bootstrap-icons/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../../assets/css/variables.css" rel="stylesheet">
  <link href="../../assets/css/style.css" rel="stylesheet">
  <link href="../../assets/css/responsive.css" rel="stylesheet">
  <link href="../../assets/css/loader.css" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="../../assets/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../../assets/images/favicon-16x16.png">
  <link rel="shortcut icon" href="../../assets/images/favicon.ico">
  <link rel="icon" type="image/png" href="../../assets/images/favicon.png">
  <link rel="apple-touch-icon" href="../../assets/images/apple-touch-icon.png">
</head>
<body>
  <nav class="navbar-app">
    <a href="../dashboard.html" class="navbar-brand-app">
      <img src="../../assets/images/mockmaster-logo.png" alt="MockMaster" class="brand-logo-img">
      MockMaster
    </a>
    <div class="navbar-actions">
      <button class="btn-ghost" data-theme-toggle><i class="bi bi-moon-stars"></i></button>
      <span class="text-muted small d-none d-sm-inline" data-user-name>User</span>
    </div>
  </nav>

  <main class="main-content">
    <div class="page-content">
      <div class="steps">
        <div class="step done"><div class="step-dot"><i class="bi bi-check"></i></div><div class="step-label">Resume</div></div>
        <div class="step active"><div class="step-dot">2</div><div class="step-label">Job</div></div>
        <div class="step"><div class="step-dot">3</div><div class="step-label">Match</div></div>
        <div class="step"><div class="step-dot">4</div><div class="step-label">Prepare</div></div>
      </div>

      <div class="page-header">
        <div class="d-flex align-items-center gap-2 mb-1">
          <span class="badge-app badge-success"><i class="bi bi-check-circle"></i> Analyzed</span>
        </div>
        <h1>Your Professional Profile</h1>
        <p>AI has extracted the following from your resume. Review and continue.</p>
      </div>

      <div class="row g-4" id="profileContent">
        <!-- Filled by JS -->
      </div>

      <div class="text-center mt-4">
        <a href="../job/job-description.html" class="btn-primary-app btn-lg">
          Add Job Description <i class="bi bi-arrow-right ms-1"></i>
        </a>
      </div>
    </div>
  </main>
  <footer class="site-footer">
    <span>© 2026 <span class="brand-name">MockMaster</span>. All Rights Reserved.</span>
    <span class="footer-sep">|</span>
    <span>Design by <span class="designer-name">KDRT IT Solutions LLP</span></span>
  </footer>


    <script src="../../vendor/supabase/supabase.js"></script>
  <script src="../../assets/js/supabase-client.js"></script>
  <script src="../../vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/firebase.js"></script>
  <script src="../../assets/js/theme.js"></script>
  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script>
    (function () {
    const r = Utils.getStored(STORAGE_KEYS.resume, null);
    if (!r || typeof r !== 'object') {
      document.getElementById('profileContent').innerHTML =
        '<div class="col-12 text-center py-5"><i class="bi bi-file-earmark-person display-4 text-muted"></i>' +
        '<h5 class="fw-bold mt-3">No resume uploaded yet</h5>' +
        '<p class="text-muted">Upload your resume to see the skills, experience and projects we find.</p>' +
        '<a class="btn btn-primary" href="upload-resume.html">Upload resume</a></div>';
      return;
    }
    const skills = r.skills || { technical: [], soft: [] };
    const education = Array.isArray(r.education) ? r.education : [];
    const experience = Array.isArray(r.experience) ? r.experience : [];
    const projects = Array.isArray(r.projects) ? r.projects : [];

    // Prefer structured experience responsibilities
    experience.forEach(ex => {
      if (!Array.isArray(ex.responsibilities)) ex.responsibilities = [];
    });

    const industries = Array.isArray(r.industries) ? r.industries : [];
    const el = document.getElementById('profileContent');
    const note = r.extractionNote
      ? `<div class="col-12"><div class="alert alert-warning small"><i class="bi bi-info-circle me-1"></i>${esc(r.extractionNote)}</div></div>`
      : (r.extractedFromFile
        ? `<div class="col-12"><div class="alert alert-success small"><i class="bi bi-check-circle me-1"></i> Data extracted from <strong>${esc(r.fileName || 'your resume')}</strong></div></div>`
        : '');
    el.innerHTML = `
      ${note}
      <div class="col-md-4">
        <div class="card-app h-100">
          <div class="card-body">
            <h6 class="fw-bold mb-3"><i class="bi bi-person me-2 text-primary"></i>Personal</h6>
            <p class="mb-1"><strong>${esc(r.name || '—')}</strong></p>
            <p class="text-muted small mb-1">${esc(r.email || '—')}</p>
            <p class="text-muted small mb-1">${esc(r.phone || '—')}</p>
            <p class="text-muted small mb-0">${esc(r.location || '—')}</p>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card-app h-100">
          <div class="card-body">
            <h6 class="fw-bold mb-3"><i class="bi bi-briefcase me-2 text-primary"></i>Professional</h6>
            <p class="mb-1"><strong>${esc(r.currentRole || '—')}</strong></p>
            <p class="text-muted small mb-1">${esc(r.experienceYears)} years · ${esc(r.careerLevel)}</p>
            <p class="text-muted small mb-0">${esc(industries.join(', ') || '—')}</p>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card-app h-100">
          <div class="card-body">
            <h6 class="fw-bold mb-3"><i class="bi bi-mortarboard me-2 text-primary"></i>Education</h6>
            ${education.length ? education.map(e => `<p class="mb-1"><strong>${esc(e.degree)}</strong></p><p class="text-muted small mb-0">${esc([e.university, e.year].filter(Boolean).join(' · '))}</p>`).join('') : '<p class="text-muted small mb-0">Not found on resume</p>'}
          </div>
        </div>
      </div>
      ${r.summary ? `<div class="col-12"><div class="card-app"><div class="card-body"><h6 class="fw-bold mb-2"><i class="bi bi-text-paragraph me-2 text-primary"></i>Summary</h6><p class="small mb-0 text-muted">${esc(r.summary)}</p></div></div></div>` : ''}
      <div class="col-12">
        <div class="card-app">
          <div class="card-body">
            <h6 class="fw-bold mb-3"><i class="bi bi-code-slash me-2 text-primary"></i>Skills</h6>
            <div class="mb-2">
              <span class="text-muted small d-block mb-1">Technical</span>
              ${(skills.technical || []).map(s => `<span class="match-tag matched">${esc(s)}</span>`).join('')}
            </div>
            <div>
              <span class="text-muted small d-block mb-1">Soft Skills</span>
              ${(skills.soft || []).map(s => `<span class="match-tag partial">${esc(s)}</span>`).join('')}
            </div>
          </div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card-app h-100">
          <div class="card-body">
            <h6 class="fw-bold mb-3"><i class="bi bi-building me-2 text-primary"></i>Experience</h6>
            ${experience.length ? experience.map(exp => `
              <div class="mb-3">
                <strong>${esc(exp.role || '')}</strong>${exp.company ? ' · ' + esc(exp.company) : ''}
                <div class="text-muted small">${esc([exp.duration, exp.location].filter(Boolean).join(' · '))}</div>
                ${(exp.responsibilities && exp.responsibilities.length) ? `<ul class="small mb-0 mt-1 ps-3">${exp.responsibilities.slice(0,5).map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
              </div>
            `).join('') : '<p class="text-muted small mb-0">No experience sections detected</p>'}
          </div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card-app h-100">
          <div class="card-body">
            <h6 class="fw-bold mb-3"><i class="bi bi-folder me-2 text-primary"></i>Projects</h6>
            ${projects.map(p => `
              <div class="mb-3">
                <strong>${esc(p.name)}</strong>
                <div class="text-muted small mb-1">${esc((p.tech || []).join(', '))}</div>
                <p class="small mb-0">${esc(p.description)}</p>
              </div>
            `).join('')}
          </div>
        </div>
      </div>
    `;
    })();
  </script>
  <script src="../../assets/js/auth-guard.js"></script>
  <script src="../../assets/js/global-loader.js"></script>
</body>
</html>
