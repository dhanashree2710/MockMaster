<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../assets/js/safe-html.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2B5748">
  <title>Update password — MockMaster</title>
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" type="image/png" href="../assets/images/favicon.png">
  <style>
    body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background:#f3f6f4; color:#1a2e28; margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1.25rem; }
    .card { background:#fff; border-radius:18px; padding:1.75rem 1.5rem; width:100%; max-width:400px; box-shadow:0 10px 30px rgba(39,51,56,.12); }
    h1 { font-size:1.35rem; margin:0 0 .35rem; color:#2B5748; }
    p { color:#5c6b64; font-size:.9rem; line-height:1.5; margin:0 0 1rem; }
    label { display:block; font-weight:600; font-size:.85rem; margin:.75rem 0 .3rem; }
    input { width:100%; box-sizing:border-box; padding:.75rem .85rem; border:1.5px solid #cfdad4; border-radius:10px; font-size:1rem; }
    input:focus { outline:none; border-color:#2B5748; }
    button { width:100%; margin-top:1.1rem; padding:.85rem; border:0; border-radius:12px; background:linear-gradient(135deg,#618764,#2B5748); color:#fff; font-weight:700; font-size:1rem; cursor:pointer; }
    button:disabled { opacity:.6; cursor:not-allowed; }
    .msg { margin-top:.9rem; font-size:.85rem; min-height:1.2em; }
    .err { color:#b3261e; } .ok { color:#1b6b3a; }
    a { color:#2B5748; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Update password</h1>
    <p id="intro">Checking your reset link…</p>
    <form id="f" style="display:none">
      <label for="p1">New password</label>
      <input type="password" id="p1" autocomplete="new-password" minlength="8" required placeholder="Min. 8 characters">
      <label for="p2">Confirm password</label>
      <input type="password" id="p2" autocomplete="new-password" minlength="8" required>
      <button type="submit" id="btn">Update password</button>
    </form>
    <div class="msg" id="msg" role="status"></div>
    <p style="margin-top:1rem">
      <a href="login.html">Sign in</a>
      · <a href="forgot-password.html">Request new link</a>
    </p>
  </div>

  <script src="../vendor/supabase/supabase.js"></script>
  <script src="../assets/js/supabase-client.js"></script>
  <script>
    (function () {
      var form = document.getElementById('f');
      var msg = document.getElementById('msg');
      var intro = document.getElementById('intro');
      var shown = false;

      function say(t, cls) {
        msg.textContent = t || '';
        msg.className = 'msg ' + (cls || '');
      }

      function showForm() {
        if (shown) return;
        shown = true;
        form.style.display = 'block';
        intro.textContent = 'Enter a new password (min. 8 characters).';
        say('');
      }

      function showInvalid(reason) {
        if (shown) return;
        intro.textContent = 'This reset link is invalid or has expired.';
        say(reason || 'Request a new link from the Forgot password page.', 'err');
      }

      // Supabase puts errors in the URL hash, e.g. #error_code=otp_expired
      function hashError() {
        try {
          var h = new URLSearchParams((location.hash || '').replace(/^#/, ''));
          var q = new URLSearchParams(location.search || '');
          var code = h.get('error_code') || q.get('error_code');
          if (code) return code === 'otp_expired'
            ? 'This link has expired or was already used. Request a new one.'
            : (h.get('error_description') || q.get('error_description') || 'Reset link is not valid.').replace(/\+/g, ' ');
        } catch (_) {}
        return '';
      }

      async function init() {
        try {
          if (window.ensureSupabaseJs) await ensureSupabaseJs();
          if (window.DB && DB.ready) await DB.ready(10000);
        } catch (_) {}

        var sb = window.getSupabase && getSupabase();
        if (!sb) { say('Could not load auth service. Refresh and try again.', 'err'); return; }

        var err = hashError();
        if (err) return showInvalid(err);

        // The recovery link signs the user in with a temporary recovery session.
        sb.auth.onAuthStateChange(function (event, session) {
          if (event === 'PASSWORD_RECOVERY' || (event === 'SIGNED_IN' && session)) showForm();
        });

        // Session may already be established (or the code exchange still running): check, then wait briefly.
        for (var i = 0; i < 12 && !shown; i++) {
          try {
            var r = await sb.auth.getSession();
            if (r && r.data && r.data.session) { showForm(); break; }
          } catch (_) {}
          await new Promise(function (res) { setTimeout(res, 400); });
        }
        if (!shown) showInvalid();
      }

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        var a = document.getElementById('p1').value;
        var b = document.getElementById('p2').value;
        if (a.length < 8) return say('Password must be at least 8 characters.', 'err');
        if (a !== b) return say('Passwords do not match.', 'err');
        var btn = document.getElementById('btn');
        btn.disabled = true;
        say('Updating…');
        try {
          var sb = getSupabase();
          if (!sb) throw new Error('Service unavailable. Refresh and try again.');
          var res = await sb.auth.updateUser({ password: a });
          if (res.error) throw new Error(res.error.message || 'Could not update password');

          // Sign out so the user signs in cleanly with the new password
          try { await sb.auth.signOut(); } catch (_) {}
          try { localStorage.removeItem('mm_session'); } catch (_) {}
          try { if (window.DB && DB.clearSession) DB.clearSession(); } catch (_) {}

          say('Password updated. Redirecting to sign in…', 'ok');
          form.style.display = 'none';
          intro.textContent = 'Password updated';
          setTimeout(function () { location.href = 'login.html'; }, 1500);
        } catch (err) {
          say((err && err.message) || 'Could not update password. Request a new link and retry.', 'err');
          btn.disabled = false;
        }
      });

      init();
    })();
  </script>
</body>
</html>
