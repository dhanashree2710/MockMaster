<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — MockMaster</title>
  <script>
    // Redirect to unified login page with signup panel open
    sessionStorage.setItem('ipa_show_signup', '1');
    window.location.replace('login.html');
  </script>
  <meta name="theme-color" content="#2B5748">
  <link rel="manifest" href="../manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MockMaster">
  <link rel="apple-touch-icon" href="../assets/images/apple-touch-icon.png">
</head>
<body>
  <p style="font-family:system-ui;text-align:center;margin-top:3rem;color:#618764;">Redirecting to sign up…</p>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('../sw.js').catch(function (e) { console.warn('SW', e); });
      });
    }
  </script>
</body>
</html>
