<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — MockMaster</title>
  <script>
    // Redirect to unified login page with signup panel open
    sessionStorage.setItem('ipa_show_signup', '1');
    window.location.replace('login.html');
  </script>
  <meta name="theme-color" content="#2B5748">
  <link rel="manifest" href="../manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MockMaster">
  <link rel="apple-touch-icon" href="../assets/images/apple-touch-icon.png">
  <link href="../assets/css/loader.css" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../assets/images/favicon-16x16.png">
  <link rel="shortcut icon" href="../assets/images/favicon.ico">
  <link rel="icon" type="image/png" href="../assets/images/favicon.png">
</head>
<body>
  <p style="font-family:system-ui;text-align:center;margin-top:3rem;color:#618764;">Redirecting to sign up…</p>
  <script>
    if ('serviceWorker' in navigator && (location.protocol === 'http:' || location.protocol === 'https:')) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('../sw.js').catch(function () { /* ignore file:// */ });
      });
    }
  </script>
  <script src="../assets/js/global-loader.js"></script>
</body>
</html>
