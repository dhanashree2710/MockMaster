<body>
  <nav class="navbar-app">
    <a href="../dashboard.html" class="navbar-brand-app">
      <img src="../../assets/images/mockmaster-logo.png" alt="MockMaster" class="brand-logo-img">
      MockMaster

    <div class="navbar-actions">
      <button class="btn-ghost" data-theme-toggle><i class="bi bi-moon-stars"></i></button>
    </div>
  </nav>

  <main class="main-content">
    <div class="page-content" style="max-width:640px;">
      <div class="page-header text-center">
        <h1>Interview Setup</h1>
        <p>Configure your mock interview. The AI will use your resume and job description.</p>
      </div>

      <div class="card-app elevated">
        <div class="card-body p-4">
          <div class="mb-3">
            <label class="form-label-app">Target Position</label>
            <input type="text" class="form-control form-control-app" id="position" value="" placeholder="e.g. Data Analyst, Backend Engineer, HR Manager" list="positionSuggestions">
            <datalist id="positionSuggestions">
              <option value="Frontend Developer"></option>
              <option value="Senior Frontend Developer"></option>
              <option value="React Developer"></option>
              <option value="Full Stack Developer"></option>
              <option value="Backend Developer"></option>
              <option value="Java Developer"></option>
              <option value="Python Developer"></option>
              <option value="Data Analyst"></option>
              <option value="QA Engineer"></option>
              <option value="HR Executive"></option>
              <option value="Senior IT Trainer"></option>
              <option value="Business Analyst"></option>
            </datalist>
            <div class="form-text small text-muted">Editable — type the role you are interviewing for.</div>
          </div>
          <div class="mb-3">
            <label class="form-label-app">Interview Type</label>
            <select class="form-select form-control-app" id="type">
              <option>Technical + HR</option>
              <option>Technical</option>
              <option>Coding + Technical</option>
              <option>HR / Behavioral</option>
              <option>System Design</option>
              <option>Frontend Focus (HTML/CSS/JS/React)</option>
              <option>Backend Focus</option>
              <option>Full Stack</option>
              <option>Data / Analytics</option>
              <option>Training / L&D</option>
              <option>Managerial</option>
            </select>
          </div>
          <div class="row g-3 mb-3">
            <div class="col-6">
              <label class="form-label-app">Difficulty</label>
              <select class="form-select form-control-app" id="difficulty">
                <option>Easy</option>
                <option selected>Medium</option>
                <option>Hard</option>
              </select>
            </div>
            <div class="col-6">
              <label class="form-label-app">Questions</label>
              <select class="form-select form-control-app" id="numQ">
                <option>8</option>
                <option selected>10</option>
                <option>15</option>
              </select>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label-app">AI Interviewer Style</label>
            <select class="form-select form-control-app" id="style">
              <option selected>Professional</option>
              <option>Friendly</option>
              <option>Strict</option>
              <option>Technical</option>
            </select>
          </div>
          <div class="mb-4">
            <label class="form-label-app">Interview Language</label>
            <select class="form-select form-control-app" id="lang">
              <option value="en">🇬🇧 English</option>
              <option value="hi">🇮🇳 Hindi</option>
              <option value="mr">🇮🇳 Marathi</option>
              <option value="ta">🇮🇳 Tamil</option>
              <option value="te">🇮🇳 Telugu</option>
            </select>
          </div>
          <div class="form-check mb-4">
            <input class="form-check-input" type="checkbox" id="instantFeedback">
            <label class="form-check-label" for="instantFeedback">Enable Instant Feedback Mode (show score after each answer)</label>
          </div>
          <button class="btn-primary-app w-100 btn-lg" id="startBtn">
            Start Interview <i class="bi bi-play-fill ms-1"></i>
          </button>
        </div>
      </div>
    </div>
  </main>
    <nav class="bottom-nav" aria-label="Mobile navigation">
    <div class="dock-bead" aria-hidden="true"><i class="bi bi-grid-1x2"></i></div>
    <a href="../dashboard.html" aria-label="Home"><i class="bi bi-grid-1x2"></i><span>Home</span></a><a href="../resume/upload-resume.html" aria-label="Resume"><i class="bi bi-file-earmark-person"></i><span>Resume</span></a><a href="../interview/interview-setup.html" class="active" aria-label="Interview"><i class="bi bi-mic"></i><span>Interview</span></a><a href="../progress.html" aria-label="Progress"><i class="bi bi-graph-up"></i><span>Progress</span></a><a href="../profile.html" aria-label="Profile"><i class="bi bi-person"></i><span>Profile</span></a>

    <span>© 2026 <span class="brand-name">MockMaster</span>. All Rights Reserved.</span>

  </footer>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../assets/js/supabase-client.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/theme.js"></script>
  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script src="../../assets/js/openai-interview.js"></script>
  <script>
    const job = Utils.getStored(STORAGE_KEYS.job, null);
    const posEl = document.getElementById('position');
    // Prefer user's saved job title — never force mock "Senior Frontend Developer"
    const savedTitle = (job && (job.position || job.title)) || '';
    posEl.value = savedTitle || posEl.value || '';
    if (!posEl.value) posEl.placeholder = 'e.g. Data Analyst, Backend Engineer, HR Manager';
    posEl.removeAttribute('readonly');
    document.getElementById('startBtn').addEventListener('click', async () => {
      const setup = {
        position: document.getElementById('position').value,
        type: document.getElementById('type').value,
        difficulty: document.getElementById('difficulty').value,
        numQuestions: +document.getElementById('numQ').value,
        style: document.getElementById('style').value,
        language: document.getElementById('lang').value,
        instantFeedback: document.getElementById('instantFeedback').checked
      };
      // Request microphone access before interview
      try {
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          stream.getTracks().forEach(t => t.stop());
          setup.micGranted = true;
        }
      } catch (err) {
        console.warn('Mic permission:', err);
        setup.micGranted = false;
        const ok = confirm('Microphone access was denied or unavailable. You can still type answers. Continue?');
        if (!ok) return;
      }
      sessionStorage.setItem('ipa_interview_setup', JSON.stringify(setup));
      location.href = 'ai-interview.html';
    });
  </script>
  <script src="../../assets/js/auth-guard.js"></script>
  <script src="../../assets/js/global-loader.js"></script>

  <script>
    (function () {
      try {
        if (window.OpenAIInterview && !OpenAIInterview.isConfigured()) {
          var b = document.getElementById('aiKeyBanner');
          if (b) b.classList.remove('d-none');
        }
      } catch (_) {}
    })();
  </script>

</body>
</html>
