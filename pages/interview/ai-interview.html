  <script>
    const setup = JSON.parse(sessionStorage.getItem('ipa_interview_setup') || '{}');
    const resumeData = (window.Utils && Utils.getStored(STORAGE_KEYS.resume)) || {};
    const jobData = (window.Utils && Utils.getStored(STORAGE_KEYS.job)) || {};
    let questions = [];
    let current = 0;
    let answers = [];
    let startTime = Date.now();
    let timerInterval;
    const interviewLang = setup.language || 'en';

    document.getElementById('styleLabel').textContent = `${setup.style || 'Professional'} · ${setup.difficulty || 'Medium'}`;
    const cleanTitle = t => String(t || '').replace(/[*_`#]+/g, '').replace(/\s+/g, ' ').trim();
    if (setup.position) setup.position = cleanTitle(setup.position);
    const displayRole = cleanTitle(setup.position || jobData.position || jobData.title || resumeData.currentRole) || 'Interview';
    document.getElementById('roleLabel').textContent = displayRole;

    // Load questions: prefer OpenAI/Gemini when configured, else local banks
    async function loadQuestions() {
      try {
        const pack = JSON.parse(sessionStorage.getItem('ipa_premium_questions') || 'null');
        if (pack && Array.isArray(pack) && pack.length && setup.premiumPack) {
          sessionStorage.removeItem('ipa_premium_questions');
          return pack.map((q, i) => ({
            id: i + 1,
            type: q.type || 'technical',
            question: q.question,
            idealAnswer: q.idealAnswer || '',
            domain: 'general',
            level: 'advanced'
          }));
        }
      } catch (_) {}

      if (window.OpenAIInterview && OpenAIInterview.isConfigured()) {
        try {
          document.getElementById('statusBadge').innerHTML =
            '<span class="spinner-grow spinner-grow-sm me-1" style="width:8px;height:8px;"></span> Preparing AI questions...';
          const result = await OpenAIInterview.buildQuestionsSmart({
            resume: resumeData,
            job: jobData,
            setup: setup
          });
          if (result && result.questions && result.questions.length) {
            console.log('[MockMaster] Questions from', result.source);
            return result.questions;
          }
        } catch (err) {
          console.warn('[MockMaster] AI question generation failed, using local banks', err);
        }
      }

      return (window.InterviewQuestions
        ? InterviewQuestions.buildInterviewQuestions({ resume: resumeData, job: jobData, setup })
        : GENERIC_QUESTIONS).slice(0, setup.numQuestions || 10);
    }

    const GENERIC_QUESTIONS = [{ id: 1, type: 'intro', question: 'Tell me about yourself and your background.' },{ id: 2, type: 'behavioral', question: 'Describe a challenge you faced at work and how you handled it.' },{ id: 3, type: 'hr', question: 'Why are you interested in this role?' },{ id: 4, type: 'closing', question: 'Do you have any questions for me?' }];

    function updateTimer() {
      const s = Math.floor((Date.now() - startTime) / 1000);
      const m = String(Math.floor(s / 60)).padStart(2, '0');
      const sec = String(s % 60).padStart(2, '0');
      document.getElementById('timer').textContent = `${m}:${sec}`;
      document.getElementById('timerM').textContent = `${m}:${sec}`;
    }
    timerInterval = setInterval(updateTimer, 1000);

    function addMessage(text, who) {
      const div = document.createElement('div');
      div.className = `message ${who}`;
      div.innerHTML = `
        <div class="message-avatar">${who === 'ai' ? '<i class="bi bi-robot"></i>' : '<i class="bi bi-person"></i>'}</div>
        <div class="message-bubble">${esc(text)}</div>
      `;
      const box = document.getElementById('messages');
      box.appendChild(div);
      // Scroll so latest question/answer is visible
      requestAnimationFrame(() => {
        box.scrollTop = box.scrollHeight;
        div.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      });
    }

    function askQuestion() {
      if (current >= questions.length) {
        finishInterview();
        return;
      }
      document.getElementById('statusBadge').innerHTML = '<span class="spinner-grow spinner-grow-sm me-1" style="width:8px;height:8px;"></span> Speaking';
      document.getElementById('qNum').textContent = current + 1;
      document.getElementById('qNumM').textContent = current + 1;
      document.getElementById('progressBar').style.width = ((current / questions.length) * 100) + '%';
      addMessage(questions[current].question, 'ai');
      document.getElementById('statusBadge').innerHTML = '<i class="bi bi-circle-fill me-1" style="font-size:8px;"></i> Listening';
      document.getElementById('answerInput').value = '';
      document.getElementById('submitBtn').disabled = true;
      document.getElementById('answerInput').focus();
    }

    document.getElementById('answerInput').addEventListener('input', e => {
      document.getElementById('submitBtn').disabled = !e.target.value.trim();
    });

    // Credits per answered question
    const CREDITS_PER_ANSWER = 10;

    /**
     * Detect "repeat the question" / "say again" / "I didn't hear" (typed or spoken) so we
     * re-ask the SAME question instead of treating it as an answer and moving on.
     * Allows longer polite phrases; real long answers are never treated as commands.
     */
    function isRepeatCommand(text) {
      const t = String(text || '').toLowerCase()
        .replace(/[^\w\s'\u0900-\u097F]/g, ' ').replace(/\s+/g, ' ').trim();
      if (!t) return false;
      const words = t.split(/\s+/).filter(Boolean);
      // Real answers are almost always longer; allow up to 22 words for polite "can you please..."
      if (words.length > 22) return false;

      // Candidate describing their own work ("I repeat the process...") is an answer, not a command
      if (/\b(i|we|they)\s+(would |will |usually |always |then |also |just )?repeat\b/.test(t)
          && !/\b(please|question|again)\b/.test(t)) return false;

      // Single-word / two-word commands
      if (/^(repeat|again|pardon|sorry|what|huh|dobara|phir|excuse me|come again)$/.test(t)) return true;

      const askWord = /\b(repeat|repeated|rephrase|reword|replay|re ?ask|ask (it |that |the question )?again|say (it |that |the question )?again|speak again|tell (it |that |me )?again|read (it |that |the question )?again|once more|one more time|come again|pardon|what was (the|that|your) question|what did you (ask|say)|which question|question (again|please)|can'?t hear|could ?n'?t hear|did ?n'?t hear|did not hear|not (able to )?hear|did ?n'?t (catch|get|understand)|did not (catch|get|understand)|not clear|unclear|samajh nahi|samjha nahi|sunai nahi|dobara|phir se|ek baar (aur|phir)|sawal (dobara|phir)|repeat karo|phir se bolo|fir se bolo|please repeat|can you repeat|could you repeat|would you repeat|repeat please|again please)\b/;
      if (askWord.test(t)) return true;
      // Short phrases with "again" / "more time"
      if (words.length <= 6 && /\b(again|more time|pardon|sorry)\b/.test(t)) return true;
      // "I didn't get that" style without other content
      if (words.length <= 10 && /\b(didn'?t|did not|cannot|can'?t)\b/.test(t) && /\b(hear|catch|get|understand|follow)\b/.test(t)) return true;
      return false;
    }

    function repeatCurrentQuestion() {
      if (!questions.length || current >= questions.length) return;
      // CRITICAL: do NOT increment `current` — stay on the same question
      const q = questions[current];
      try { stopMic(); } catch (_) {}
      try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch (_) {}
      const box = document.getElementById('answerInput');
      if (box) box.value = '';
      document.getElementById('submitBtn').disabled = true;
      addMessage('Sure — repeating question ' + (current + 1) + '.', 'ai');
      setTimeout(() => {
        addMessage(q.question, 'ai');
        if (typeof speakText === 'function') speakText(q.question);
        document.getElementById('statusBadge').innerHTML = '<i class="bi bi-circle-fill me-1" style="font-size:8px;"></i> Listening';
        if (box) { box.value = ''; box.focus(); }
        document.getElementById('submitBtn').disabled = true;
      }, 400);
      if (window.Utils && Utils.showToast) Utils.showToast('Repeating the same question…', 'info', 1800);
    }

    function submitAnswerText(ans) {
      ans = String(ans || '').trim();
      if (!ans) return;
      // User asked to repeat — do NOT advance, do NOT score
      if (isRepeatCommand(ans)) {
        repeatCurrentQuestion();
        return;
      }
      if (!questions.length || current >= questions.length) return;

      addMessage(ans, 'user');
      const score = scoreAnswer(ans, questions[current]);
      const ev = buildEvaluation(ans, score, questions[current]);
      answers.push({
        question: questions[current].question,
        type: questions[current].type,
        level: questions[current].level,
        domain: questions[current].domain,
        basedOn: questions[current].basedOn || '',
        answer: ans,
        score: Number(score) || 0,
        evaluation: ev.evalText,
        betterAnswer: ev.better
      });
      if (window.Utils && Utils.addCredits) {
        const bal = Utils.addCredits(CREDITS_PER_ANSWER, 'Answered interview question');
        if (Utils.showToast) Utils.showToast('+' + CREDITS_PER_ANSWER + ' credits · Balance ' + bal, 'success', 2200);
      }
      if (setup.instantFeedback) {
        addMessage('Quick feedback: Score ' + score + '/100 for this answer. Keep using concrete examples.', 'ai');
      }
      current++;
      document.getElementById('submitBtn').disabled = true;
      const box = document.getElementById('answerInput');
      if (box) box.value = '';
      setTimeout(askQuestion, setup.instantFeedback ? 1200 : 600);
    }

    document.getElementById('submitBtn').addEventListener('click', () => {
      const ans = document.getElementById('answerInput').value.trim();
      if (!ans) return;
      submitAnswerText(ans);
    });

    // Enter key also submits (with same repeat protection)
    document.getElementById('answerInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        const ans = document.getElementById('answerInput').value.trim();
        if (ans) submitAnswerText(ans);
      }
    });

    document.getElementById('endBtn').addEventListener('click', () => {
      if (confirm('End interview and view report?')) finishInterview();
    });

    
    function personalFallback(q) {
      const text = String((q && q.question) || '');
      const low = text.toLowerCase();
      const type = (q && q.type) || '';
      const projects = (resumeData && resumeData.projects) || [];
      const exps = (resumeData && resumeData.experience) || [];
      const techOf = p => Array.isArray(p.tech) ? p.tech.join(', ') : (p.tech || '');
      if (type === 'project' || /project/.test(low)) {
        const p = projects.find(x => x && x.name && low.includes(String(x.name).toLowerCase()));
        if (p) {
          const tech = techOf(p);
          return 'In my "' + p.name + '" project' + (tech ? ' (built with ' + tech + ')' : '') + ', ' +
            (p.description ? 'the goal was: ' + String(p.description).trim().replace(/\.$/, '') + '. ' : 'the goal was [state the problem it solved]. ') +
            'My role was [what you personally built or owned]. The hardest part was [one real challenge], which I solved by [your approach and why you chose it' + (tech ? ' over other options than ' + tech.split(',')[0].trim() : '') + ']. ' +
            'The result was [add a measurable outcome: users, speed, time saved, accuracy]. If I rebuilt it today I would [one concrete improvement].';
        }
      }
      if (type === 'resume') {
        const e = exps.find(x => x && ((x.company && low.includes(String(x.company).toLowerCase())) || (x.role && low.includes(String(x.role).toLowerCase()))));
        if (e) {
          const resp = (e.responsibilities || []).slice(0, 2).join('; ');
          return 'As ' + (e.role || 'a team member') + (e.company ? ' at ' + e.company : '') + ', I ' + (resp ? resp.charAt(0).toLowerCase() + resp.slice(1) : 'handled [your main responsibilities]') +
            '. My biggest achievement there was [one specific result with a number]. It prepares me for this role because [link 1-2 of those skills to the job requirements].';
        }
      }
      return '';
    }

    function getModelAnswer(q) {
      // 1) Prefer the AI-written answer for THIS question (set after grading)
      if (q && q.betterAnswer && String(q.betterAnswer).trim().length > 40) return String(q.betterAnswer).trim();
      if (q && q.idealAnswer && String(q.idealAnswer).trim().length > 30) return String(q.idealAnswer).trim();
      const question = (q && q.question) ? q.question : String(q || '');
      // 2) Resume-grounded answers for project / experience questions (never a generic keyword answer)
      const pf = personalFallback(q);
      if (pf) return pf;
      // 3) Local bank — ONLY for plain technical/skill questions, not resume/project/behavioral ones
      const bankOk = !q || !q.type || /^(technical|coding|gap|hr|intro|closing|behavioral|scenario)$/.test(q.type);
      if (bankOk && window.InterviewQuestions && InterviewQuestions.getModelAnswer) {
        const m = InterviewQuestions.getModelAnswer(question);
        if (m && String(m).trim().length > 30) return String(m).trim();
      }
      // 4) Last resort: a structure that fits the question type
      if (q && q.type === 'behavioral') return 'Use STAR for "' + question.slice(0, 90) + '": Situation (context), Task (your responsibility), Action (what YOU did), Result (a measurable outcome), and what you learned.';
      return 'Answer "' + question.slice(0, 90) + '" directly in the first sentence, back it with one concrete example from your own work, and finish by linking it to this role.';
    }

    function scoreAnswer(answer, q) {
      const text = (answer || '').trim();
      const aLow = text.toLowerCase();
      const words = text.split(/\s+/).filter(Boolean);

      // Explicit non-answers → very low score
      if (!text || words.length === 0) return 15;
      if (/^(no|n\/a|na|idk|none|-)$/i.test(text)) return 18;
      if (/can'?t (get|answer|say)|don'?t know|dont know|no idea|not sure|unable to answer|skip|pass/i.test(aLow) && words.length < 12) {
        return 22;
      }
      if (words.length <= 2) return 25;
      if (words.length <= 5) return 32;

      let score = 40;
      if (words.length >= 12) score += 10;
      if (words.length >= 25) score += 10;
      if (words.length >= 45) score += 8;

      const qWords = (q && q.question ? q.question : '').toLowerCase().split(/\W+/).filter(w => w.length > 3);
      let hits = 0;
      qWords.forEach(w => { if (aLow.includes(w)) hits++; });
      score += Math.min(15, hits * 2);

      // Compare with the reference/ideal answer for THIS question (works for every role, not only frontend)
      try {
        let ref = (q && q.idealAnswer) ? String(q.idealAnswer) : '';
        if (!ref && window.InterviewQuestions && InterviewQuestions.getModelAnswer) ref = String(InterviewQuestions.getModelAnswer((q && q.question) || '') || '');
        if (ref.length > 40) {
          const STOP = new Set('about above after again also because before being between could does doing during each from have having into more most other should that their them then there these they this those through under until very were what when where which while with would your you are and the for not but can will use used using'.split(' '));
          const keys = Array.from(new Set(ref.toLowerCase().split(/\W+/).filter(w => w.length > 4 && !STOP.has(w)))).slice(0, 18);
          if (keys.length >= 4) {
            const got = keys.filter(k => aLow.includes(k.slice(0, Math.max(5, k.length - 2)))).length;
            score += Math.round(Math.min(1, got / Math.min(keys.length, 10)) * 22);
          }
        }
      } catch (_) {}

      // Concept keywords for common frontend topics
      if (/\bhtml\b|hypertext|markup/i.test(q.question || '')) {
        if (/hypertext|markup|structure|browser/i.test(aLow)) score += 10;
      }
      if (/\b(var|let|const)\b/i.test(q.question || '') && /javascript|\bjs\b|declar|hoist/i.test(q.question || '')) {
        if (/scope|block|hoist|reassign|redeclar/i.test(aLow)) score += 12;
        if (/const/.test(aLow) && /let/.test(aLow) && /var/.test(aLow)) score += 8;
      }
      if (/semantic/i.test(q.question || '')) {
        if (/header|footer|nav|main|article|section|meaning/i.test(aLow)) score += 12;
      }
      if (/data types/i.test(q.question || '')) {
        if (/string|number|boolean|object|undefined|null|symbol|bigint/i.test(aLow)) score += 12;
      }
      if (/arrow function/i.test(q.question || '')) {
        if (/reuse|block|parameter|this|=>|arrow/i.test(aLow)) score += 10;
      }

      if (/for example|because|such as|for instance|i (used|built|implemented)/i.test(text)) score += 6;

      // Cap weak content
      if (words.length < 15 && hits < 2) score = Math.min(score, 50);

      return Math.max(15, Math.min(96, Math.round(score)));
    }

    function buildEvaluation(answer, score, q) {
      const model = getModelAnswer(q);
      let evalText;
      if (score < 30) {
        evalText = 'Incorrect or incomplete. Review the suggested answer and try a fuller response next time.';
      } else if (score < 50) {
        evalText = 'Needs work. The answer is too short or missing key points. Use the suggested answer as a guide.';
      } else if (score < 70) {
        evalText = 'Partial answer. You touched the topic but need clearer structure and a concrete example.';
      } else if (score < 85) {
        evalText = 'Solid response. Add a bit more structure and a concrete example to reach a strong score.';
      } else {
        evalText = 'Strong answer — clear, relevant, and well explained.';
      }
      return { evalText, better: model };
    }

    let finishing = false;

    function showSavingOverlay(text) {
      let o = document.getElementById('savingOverlay');
      if (!o) {
        o = document.createElement('div');
        o.id = 'savingOverlay';
        o.style.cssText = 'position:fixed;inset:0;z-index:5000;background:rgba(20,30,26,.72);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;text-align:center;padding:1rem';
        o.innerHTML = '<div><div class="spinner-border mb-3" role="status"></div><div id="savingOverlayText"></div></div>';
        document.body.appendChild(o);
      }
      document.getElementById('savingOverlayText').textContent = text || 'Saving your report…';
    }

    async function finishInterview() {
      if (finishing) return;
      finishing = true;
      clearInterval(timerInterval);
      try { stopMic(); } catch (_) {}
      try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch (_) {}

      // Nothing answered → no report to create (prevents empty 0% rows in History)
      if (!answers.length) {
        if (window.Utils && Utils.showToast) Utils.showToast('Answer at least one question to get a report.', 'info', 2500);
        setTimeout(() => { location.href = '../dashboard.html'; }, 1200);
        return;
      }

      let duration = Math.floor((Date.now() - startTime) / 1000);
      if (duration < 5) duration = Math.max(5, answers.length * 15);

      // Grade every answer against its own question (with resume + JD context) and write a
      // question-specific suggested answer. Falls back to the quick local scores on any failure.
      let aiStrengths = [], aiImprovements = [];
      if (window.OpenAIInterview && OpenAIInterview.isConfigured() && OpenAIInterview.gradeAnswers) {
        showSavingOverlay('Evaluating your answers…');
        try {
          const graded = await Promise.race([
            OpenAIInterview.gradeAnswers({ resume: resumeData, job: jobData, setup, answers }),
            new Promise(res => setTimeout(() => res(null), 45000))
          ]);
          if (graded) {
            graded.forEach((g, i) => {
              if (!g || !answers[i]) return;
              answers[i].score = g.score;
              if (g.evaluation) answers[i].evaluation = g.evaluation;
              if (g.betterAnswer) answers[i].betterAnswer = g.betterAnswer;
              if (g.strengths && g.strengths.length) aiStrengths = aiStrengths.concat(g.strengths);
              if (g.improvement && g.score < 70) aiImprovements.push(g.improvement);
            });
          }
        } catch (err) { console.warn('AI grading failed, using quick scores', err); }
      }
      // Any answer still without a question-specific suggestion gets the best local one
      answers.forEach((a, i) => {
        if (!a.betterAnswer || String(a.betterAnswer).trim().length < 40) {
          a.betterAnswer = getModelAnswer({ question: a.question, type: a.type, idealAnswer: (questions[i] && questions[i].idealAnswer) || '' });
        }
      });

      // Always compute from per-answer scores so the report never shows 0 after real answers
      let overallScore = 0;
      const scored = answers.map(a => Number(a.score)).filter(n => !isNaN(n) && n >= 0);
      if (scored.length) {
        overallScore = Math.round(scored.reduce((a, b) => a + b, 0) / scored.length);
      }
      // Safety: if somehow all zeros but answers exist with text, give a minimal floor from length
      if (overallScore === 0 && answers.length) {
        const withText = answers.filter(a => String(a.answer || '').trim().length > 5);
        if (withText.length) {
          overallScore = Math.max(25, Math.round(
            withText.reduce((a, b) => a + Math.min(70, 20 + String(b.answer || '').split(/\s+/).length), 0) / withText.length
          ));
          answers.forEach(a => {
            if (!(Number(a.score) > 0) && String(a.answer || '').trim().length > 5) {
              a.score = Math.min(70, 20 + String(a.answer).split(/\s+/).length);
            }
          });
        }
      }
      overallScore = Math.max(0, Math.min(100, overallScore));

      const completedAt = new Date().toISOString();
      const cid = Date.now();
      const positionClean = cleanTitle(setup.position || jobData.position || jobData.title || 'Mock Interview');
      setup.position = positionClean;

      const report = { answers, setup, duration, overallScore, completedAt, cid };
      try { sessionStorage.setItem('ipa_last_report', JSON.stringify(report)); } catch (_) {}

      try {
        const archive = JSON.parse(localStorage.getItem('ipa_reports_archive') || '[]');
        archive.unshift(report);
        localStorage.setItem('ipa_reports_archive', JSON.stringify(archive.slice(0, 30)));
      } catch (_) {}

      // Remember questions so the NEXT attempt for the same JD gets different ones
      try { if (window.InterviewQuestions && InterviewQuestions.markQuestionsUsed) InterviewQuestions.markQuestionsUsed(positionClean, answers); } catch (_) {}

      // Local history is the source of truth for scores (never store a 0 when answers exist)
      const sessions = Utils.getStored(STORAGE_KEYS.sessions, []) || [];
      sessions.unshift({
        id: cid, position: positionClean, score: overallScore, date: completedAt, duration,
        difficulty: setup.difficulty, style: setup.style, type: setup.type, language: setup.language,
        numQuestions: setup.numQuestions || answers.length, answers, setup
      });
      Utils.setStored(STORAGE_KEYS.sessions, sessions.slice(0, 30));

      if (window.Utils && Utils.addCredits) Utils.addCredits(25, 'Completed mock interview');

      // Upload to Supabase and WAIT for it (navigating away used to cancel the upload → empty 0% rows)
      const uniq = arr => Array.from(new Set(arr.filter(Boolean)));
      const strengths = uniq(aiStrengths).slice(0, 4).length ? uniq(aiStrengths).slice(0, 4)
        : (overallScore >= 70 ? ['Clear, relevant answers', 'Good use of examples'] : ['Completed the session']);
      const improvements = uniq(aiImprovements).slice(0, 4).length ? uniq(aiImprovements).slice(0, 4)
        : (overallScore < 70 ? ['Add concrete examples and results', 'Give fuller, structured answers'] : ['Keep practicing advanced scenarios']);
      const payload = {
        cid, setup, answers, duration, overallScore, completedAt, strengths, improvements,
        resumeId: (Utils.getStored(STORAGE_KEYS.resume) || {}).id || null,
        jobId: (Utils.getStored(STORAGE_KEYS.job) || {}).id || null
      };
      const cloudOn = !!(window.DB && DB.isConfigured && DB.isConfigured() && DB.getSession && DB.getSession());
      if (cloudOn) {
        showSavingOverlay('Saving your report…');
        try {
          await Promise.race([
            (async () => { await DB.saveInterviewResult(payload); try { await DB.refreshProgress(); } catch (_) {} })(),
            new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 12000))
          ]);
        } catch (err) {
          console.warn('Cloud save pending, will retry', err);
          try {
            const q = JSON.parse(localStorage.getItem('mm_pending_interviews') || '[]');
            q.push(payload);
            localStorage.setItem('mm_pending_interviews', JSON.stringify(q.slice(-5)));
          } catch (_) {}
        }
      }
      location.href = '../report/interview-report.html';
    }

    // ---- Text-to-Speech (AI asks question) ----
    function speakText(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      const ttsCfg = (window.APP_CONFIG && APP_CONFIG.tts) || {};
      const langMap = ttsCfg.langMap || { en: 'en-IN' };
      const code = interviewLang || 'en';
      u.lang = langMap[code] || (code === 'en' ? 'en-IN' : code + '-IN');
      u.rate = ttsCfg.defaultRate != null ? ttsCfg.defaultRate : 0.92;
      u.pitch = ttsCfg.defaultPitch != null ? ttsCfg.defaultPitch : 1.0;

      const voices = window.speechSynthesis.getVoices() || [];
      // Prefer Indian / matching language voices
      let preferred =
        voices.find(v => v.lang === u.lang) ||
        voices.find(v => /en-IN|Indian English|hi-IN|Google.*India/i.test(v.lang + ' ' + v.name)) ||
        voices.find(v => (v.lang || '').toLowerCase().startsWith(code)) ||
        voices.find(v => /^en/i.test(v.lang));
      if (preferred) u.voice = preferred;

      u.onstart = () => {
        document.getElementById('statusBadge').innerHTML = '<span class="spinner-grow spinner-grow-sm me-1" style="width:8px;height:8px;"></span> Speaking';
      };
      u.onend = () => {
        document.getElementById('statusBadge').innerHTML = '<i class="bi bi-circle-fill me-1" style="font-size:8px;"></i> Listening';
      };
      window.speechSynthesis.speak(u);
    }

    // ---- Speech-to-Text (Mic) ----
    let isRecording = false;
    let recognition = null;
    const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;

    function setMicUI(recording) {
      const btn = document.getElementById('micBtn');
      if (!btn) return;
      const icon = btn.querySelector('i');
      if (recording) {
        btn.classList.add('recording', 'text-danger');
        if (icon) icon.className = 'bi bi-mic-fill fs-5';
        document.getElementById('statusBadge').innerHTML = '<span class="spinner-grow spinner-grow-sm me-1" style="width:8px;height:8px;"></span> Listening';
      } else {
        btn.classList.remove('recording', 'text-danger');
        if (icon) icon.className = 'bi bi-mic fs-5';
      }
    }

    // Collapse consecutive repeated words/phrases (common mobile STT bug)
    function dedupeSpeechText(text) {
      if (!text) return '';
      // Remove consecutive identical words: "histogram histogram histogram" -> "histogram"
      let t = text.replace(/\b(\w+)(?:\s+\1)+\b/gi, '$1');
      // Collapse repeated short phrases (2–5 words) spoken multiple times
      t = t.replace(/\b((?:\w+\s+){1,4}\w+)(?:\s+\1)+\b/gi, '$1');
      // Collapse stutter-style repeats at start of words (e.g. "th- the")
      t = t.replace(/\b(\w{1,3})-\s*\1\b/gi, '$1');
      // Clean extra spaces / punctuation clutter
      return t.replace(/\s{2,}/g, ' ').trim();
    }

    async function startMic() {
      if (!SpeechRecognitionAPI) {
        if (window.Utils && Utils.showToast) {
          Utils.showToast('Speech recognition is not supported here. Please type your answer.', 'warning');
        } else {
          alert('Speech recognition is not supported in this browser. Please use Chrome/Edge, or type your answer.');
        }
        return;
      }

      // Ensure in-app mic permission before starting recognition
      if (window.AppPermissions) {
        const state = await AppPermissions.getMicPermissionState();
        if (state !== 'granted') {
          const result = await AppPermissions.ensureMicrophonePermission({ force: state === 'denied' });
          if (!result.granted) {
            if (window.Utils && Utils.showToast) {
              Utils.showToast('Microphone not available. Type your answer instead.', 'info');
            }
            return;
          }
        }
      }

      try {
        // Stop any previous instance cleanly
        if (recognition) {
          try { recognition.onend = null; recognition.onresult = null; recognition.stop(); } catch (_) {}
          recognition = null;
        }

        recognition = new SpeechRecognitionAPI();
        // continuous=false is far more stable and avoids duplicate transcripts
        recognition.continuous = false;
        recognition.interimResults = true;
        const ttsCfg = (window.APP_CONFIG && APP_CONFIG.tts) || {};
        const langMap = ttsCfg.langMap || { en: 'en-IN' };
        recognition.lang = langMap[interviewLang] || (interviewLang === 'en' ? 'en-IN' : (interviewLang + '-IN'));
        recognition.maxAlternatives = 1;

        // Snapshot when mic starts — only append NEW finals once
        let baseText = (document.getElementById('answerInput').value || '').trim();
        let sessionFinals = '';
        let lastFinalNorm = '';
        let processedResultIndex = 0;

        recognition.onstart = () => {
          isRecording = true;
          setMicUI(true);
        };

        recognition.onresult = (event) => {
          let interim = '';
          // Only process results from resultIndex forward to avoid re-processing
          for (let i = event.resultIndex; i < event.results.length; i++) {
            if (i < processedResultIndex && event.results[i].isFinal) continue;
            const t = (event.results[i][0].transcript || '').trim();
            if (!t) continue;
            if (event.results[i].isFinal) {
              const norm = t.toLowerCase().replace(/\s+/g, ' ');
              // Skip exact duplicate finals (common mobile bug)
              if (norm === lastFinalNorm) continue;
              // Skip if this text is already at the end of what we have
              const soFar = (sessionFinals || '').toLowerCase();
              if (soFar.endsWith(norm) || soFar.includes(norm)) continue;
              // Voice command: "repeat the question" → re-ask, do not treat as answer
              if (isRepeatCommand(t) || isRepeatCommand((sessionFinals ? sessionFinals + ' ' : '') + t)) {
                try { recognition.stop(); } catch (_) {}
                isRecording = false;
                setMicUI(false);
                lastFinalNorm = norm;
                processedResultIndex = i + 1;
                repeatCurrentQuestion();
                return;
              }
              sessionFinals = (sessionFinals ? sessionFinals + ' ' : '') + t;
              lastFinalNorm = norm;
              processedResultIndex = i + 1;
            } else {
              interim += (interim ? ' ' : '') + t;
            }
          }
          const box = document.getElementById('answerInput');
          if (!box) return;
          const combined = [baseText, sessionFinals, interim].filter(Boolean).join(' ');
          box.value = dedupeSpeechText(combined);
          document.getElementById('submitBtn').disabled = !box.value.trim();
        };

        recognition.onerror = (err) => {
          console.warn('Speech error:', err);
          if (err.error === 'aborted' || err.error === 'no-speech') return;
          isRecording = false;
          setMicUI(false);
          if (err.error === 'not-allowed') {
            if (window.AppPermissions) {
              AppPermissions.showPermissionDialog({ required: false }).then(() => {});
            } else if (window.Utils && Utils.showToast) {
              Utils.showToast('Microphone blocked. Allow mic in browser site settings.', 'warning');
            } else {
              alert('Microphone permission denied. Allow mic access in browser settings.');
            }
          }
        };

        recognition.onend = () => {
          // Auto-restart only if user still wants to record (pause recovery)
          if (isRecording) {
            // Commit session finals into base so restart does not re-append
            if (sessionFinals) {
              baseText = dedupeSpeechText([baseText, sessionFinals].filter(Boolean).join(' '));
              sessionFinals = '';
              lastFinalNorm = '';
              processedResultIndex = 0;
              const box = document.getElementById('answerInput');
              if (box) box.value = baseText;
            }
            try {
              recognition.start();
              return;
            } catch (_) {}
          }
          isRecording = false;
          setMicUI(false);
          const box = document.getElementById('answerInput');
          if (box) box.value = dedupeSpeechText(box.value);
        };

        recognition.start();
      } catch (e) {
        console.error(e);
        alert('Could not start microphone. Please type your answer.');
        isRecording = false;
        setMicUI(false);
      }
    }

    function stopMic() {
      isRecording = false; // must set first so onend does not auto-restart
      if (recognition) {
        try {
          recognition.onend = null;
          recognition.stop();
        } catch (_) {}
        recognition = null;
      }
      setMicUI(false);
      // Final dedupe pass when user stops
      const box = document.getElementById('answerInput');
      if (box && box.value) box.value = dedupeSpeechText(box.value);
    }

    document.getElementById('micBtn')?.addEventListener('click', async () => {
      if (isRecording) stopMic();
      else await startMic();
    });

    // Speak each question when asked
    const _askQuestion = askQuestion;
    askQuestion = function () {
      if (current >= questions.length) {
        finishInterview();
        return;
      }
      stopMic();
      document.getElementById('statusBadge').innerHTML = '<span class="spinner-grow spinner-grow-sm me-1" style="width:8px;height:8px;"></span> Speaking';
      document.getElementById('qNum').textContent = current + 1;
      document.getElementById('qNumM').textContent = current + 1;
      document.getElementById('progressBar').style.width = ((current / questions.length) * 100) + '%';
      const qText = questions[current].question;
      try { if (window.InterviewQuestions && InterviewQuestions.markQuestionsUsed) InterviewQuestions.markQuestionsUsed(setup.position || jobData.position || jobData.title, [questions[current]]); } catch (_) {}
      addMessage(qText, 'ai');
      document.getElementById('answerInput').value = '';
      document.getElementById('submitBtn').disabled = true;
      document.getElementById('answerInput').focus();
      speakText(qText);
    };

    // Stop mic when submitting
    const submitBtn = document.getElementById('submitBtn');
    submitBtn.addEventListener('click', () => stopMic(), true);

    // Start — load AI questions first, then begin
    if ('speechSynthesis' in window) {
      window.speechSynthesis.getVoices();
      window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    }

    (async function bootInterview() {
      try {
        questions = await loadQuestions();
      } catch (e) {
        console.warn(e);
        questions = GENERIC_QUESTIONS.slice(0, setup.numQuestions || 10);
      }
      if (!questions || !questions.length) {
        questions = GENERIC_QUESTIONS;
      }
      document.getElementById('qTotal').textContent = questions.length;
      document.getElementById('qTotalM').textContent = questions.length;
      askQuestion();
    })();
  </script>
  <script src="../../assets/js/auth-guard.js"></script>
  <script src="../../assets/js/global-loader.js"></script>
