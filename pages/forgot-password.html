<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../assets/js/safe-html.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2B5748">
  <title>Change password — MockMaster</title>
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" type="image/png" href="../assets/images/favicon.png">
  <style>
    body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background:#f3f6f4; color:#1a2e28; margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1.25rem; }
    .card { background:#fff; border-radius:18px; padding:1.75rem 1.5rem; width:100%; max-width:400px; box-shadow:0 10px 30px rgba(39,51,56,.12); }
    h1 { font-size:1.35rem; margin:0 0 .35rem; color:#2B5748; }
    p { color:#5c6b64; font-size:.9rem; line-height:1.5; margin:0 0 1rem; }
    label { display:block; font-weight:600; font-size:.85rem; margin:.75rem 0 .3rem; }
    input { width:100%; box-sizing:border-box; padding:.75rem .85rem; border:1.5px solid #cfdad4; border-radius:10px; font-size:1rem; }
    input:focus { outline:none; border-color:#2B5748; box-shadow:0 0 0 3px rgba(43,87,72,.12); }
    button { width:100%; margin-top:1.1rem; padding:.85rem; border:0; border-radius:12px; background:linear-gradient(135deg,#618764,#2B5748); color:#fff; font-weight:700; font-size:1rem; cursor:pointer; }
    button:disabled { opacity:.6; cursor:not-allowed; }
    .msg { margin-top:.9rem; font-size:.85rem; min-height:1.2em; white-space:pre-line; }
    .err { color:#b3261e; } .ok { color:#1b6b3a; }
    a { color:#2B5748; font-weight:600; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Change password</h1>
    <p>Enter your email, current password, and a new password. Everything is saved from this form only — no email link.</p>
    <form id="f">
      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="email" required placeholder="you@example.com">

      <label for="current">Current password</label>
      <input type="password" id="current" autocomplete="current-password" required placeholder="Your current password">

      <label for="p1">New password</label>
      <input type="password" id="p1" autocomplete="new-password" minlength="8" required placeholder="Min. 8 characters">

      <label for="p2">Confirm new password</label>
      <input type="password" id="p2" autocomplete="new-password" minlength="8" required placeholder="Re-enter new password">

      <button type="submit" id="btn">Save new password</button>
    </form>
    <div class="msg" id="msg" role="status"></div>
    <p style="margin-top:1.25rem; margin-bottom:0"><a href="login.html">Back to sign in</a></p>
  </div>

  <script src="../vendor/supabase/supabase.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/supabase-client.js"></script>
  <script>
    (function () {
      var form = document.getElementById('f');
      var msg = document.getElementById('msg');
      var btn = document.getElementById('btn');

      function say(t, cls) {
        msg.textContent = t || '';
        msg.className = 'msg ' + (cls || '');
      }

      try {
        var q = new URLSearchParams(location.search).get('email');
        if (q) document.getElementById('email').value = q;
      } catch (_) {}

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        var email = document.getElementById('email').value.trim();
        var current = document.getElementById('current').value;
        var a = document.getElementById('p1').value;
        var b = document.getElementById('p2').value;

        if (!email) return say('Enter your email.', 'err');
        if (!current) return say('Enter your current password.', 'err');
        if (a.length < 8) return say('New password must be at least 8 characters.', 'err');
        if (a !== b) return say('New passwords do not match.', 'err');
        if (a === current) return say('New password must be different from the current one.', 'err');

        btn.disabled = true;
        say('Saving…');

        try {
          if (window.ensureSupabaseJs) await ensureSupabaseJs();
          if (window.DB && DB.ready) await DB.ready(10000);

          var sb = window.getSupabase && getSupabase();
          if (!sb) throw new Error('Could not load auth. Refresh and try again.');

          // 1) Verify identity with current password (form only — no email / no server deploy)
          var sign = await sb.auth.signInWithPassword({
            email: email.toLowerCase(),
            password: current
          });
          if (sign.error) {
            var m = sign.error.message || 'Could not verify current password';
            if (/invalid|credentials|password/i.test(m)) {
              m = 'Email or current password is incorrect.';
            }
            throw new Error(m);
          }

          // 2) Set new password on this session
          var upd = await sb.auth.updateUser({ password: a });
          if (upd.error) throw new Error(upd.error.message || 'Could not update password');

          // 3) Sign out so they log in cleanly with the new password
          try { await sb.auth.signOut(); } catch (_) {}
          try { if (window.DB && DB.clearSession) DB.clearSession(); } catch (_) {}

          say('Password updated. Sign in with your new password.', 'ok');
          form.style.display = 'none';
          setTimeout(function () {
            location.href = 'login.html?email=' + encodeURIComponent(email);
          }, 1500);
        } catch (err) {
          say((err && err.message) || 'Could not update password.', 'err');
          btn.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
