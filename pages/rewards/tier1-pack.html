<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tier-1 Question Pack — MockMaster</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../../assets/css/variables.css" rel="stylesheet">
  <link href="../../assets/css/style.css" rel="stylesheet">
  <link href="../../assets/css/loader.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar-app">
    <a href="../dashboard.html" class="navbar-brand-app"><img src="../../assets/images/mockmaster-logo.png" class="brand-logo-img" alt=""> MockMaster</a>
    <a href="../rewards.html" class="btn-outline-app btn-sm">Rewards</a>
  </nav>
  <main class="main-content"><div class="page-content">
    <div class="page-header"><h1>Tier-1 Tech Insider Question Pack</h1><p>Practice questions inspired by top product companies. Start a focused mock interview with this pack.</p></div>
    <div id="out"></div>
  </div></main>
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/auth-guard.js"></script>
  <script>
    const PACK = [
      { type: 'behavioral', question: 'Tell me about a time you disagreed with a tech lead. How did you handle it?' },
      { type: 'behavioral', question: 'Describe a project that failed. What did you learn?' },
      { type: 'system', question: 'How would you design a URL shortener like bit.ly?' },
      { type: 'system', question: 'Design a news feed that scales to millions of users.' },
      { type: 'technical', question: 'Explain how you would reduce latency in a slow API.' },
      { type: 'technical', question: 'How do you ensure code quality in a fast-moving team?' },
      { type: 'behavioral', question: 'Tell me about mentoring someone who was struggling.' },
      { type: 'system', question: 'How would you design rate limiting for a public API?' },
      { type: 'technical', question: 'Walk through debugging a production-only bug.' },
      { type: 'hr', question: 'Why this company and why this role now?' }
    ];
    const out = document.getElementById('out');
    try { if (!Utils.getRedeemed().includes('tier1Pack')) Utils.markRedeemed('tier1Pack'); } catch(_) {}
    if (false && !Utils.getRedeemed().includes('tier1Pack')) {
      out.innerHTML = '<div class="card-app"><div class="card-body"><p>Redeem <strong>Tier-1 Tech Insider Question Pack</strong> (250 credits) to unlock.</p><a href="../rewards.html" class="btn-primary-app">Rewards</a></div></div>';
    } else {
      out.innerHTML = `
        <div class="card-app mb-3"><div class="card-body">
          <button class="btn-primary-app mb-3" id="startPack">Start interview with this pack</button>
          <ol class="mb-0">${PACK.map(q => `<li class="mb-2"><span class="badge-app badge-primary me-1">${q.type}</span> ${q.question}</li>`).join('')}</ol>
        </div></div>`;
      document.getElementById('startPack').onclick = () => {
        sessionStorage.setItem('ipa_interview_setup', JSON.stringify({
          position: 'Tier-1 Company Interview',
          type: 'Technical + HR',
          difficulty: 'Hard',
          numQuestions: PACK.length,
          style: 'Professional',
          language: 'en',
          premiumPack: 'tier1Pack'
        }));
        sessionStorage.setItem('ipa_premium_questions', JSON.stringify(PACK));
        location.href = '../interview/ai-interview.html';
      };
    }
  </script>
  <script src="../../assets/js/global-loader.js"></script>
</body>
</html>
