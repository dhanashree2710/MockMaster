<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Tone & Pace — MockMaster</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../../assets/css/variables.css" rel="stylesheet">
  <link href="../../assets/css/style.css" rel="stylesheet">
  <link href="../../assets/css/loader.css" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="../../assets/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../../assets/images/favicon-16x16.png">
  <link rel="shortcut icon" href="../../assets/images/favicon.ico">
  <link rel="icon" type="image/png" href="../../assets/images/favicon.png">
  <link rel="apple-touch-icon" href="../../assets/images/apple-touch-icon.png">
</head>
<body>
  <nav class="navbar-app">
    <a href="../dashboard.html" class="navbar-brand-app"><img src="../../assets/images/mockmaster-logo.png" class="brand-logo-img" alt=""> MockMaster</a>
    <a href="../rewards.html" class="btn-outline-app btn-sm">Rewards</a>
  </nav>
  <main class="main-content"><div class="page-content">
    <div class="page-header"><h1>Live AI Voice Tone & Pace Replay</h1><p>Estimated pace, filler words, and confidence from your last interview answers (text-based analysis of spoken/typed responses).</p></div>
    <div id="out"></div>
  </div></main>
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/auth-guard.js"></script>
  <script>
    const out = document.getElementById('out');
    try { if (!Utils.getRedeemed().includes('voiceReplay')) Utils.markRedeemed('voiceReplay'); } catch(_) {}
    if (false && !Utils.getRedeemed().includes('voiceReplay')) {
      out.innerHTML = '<div class="card-app"><div class="card-body"><p>Redeem <strong>Live AI Voice Tone & Pace Replay</strong> (200 credits) to unlock.</p><a href="../rewards.html" class="btn-primary-app">Rewards</a></div></div>';
    } else {
      const report = JSON.parse(sessionStorage.getItem('ipa_last_report')||'null') || (JSON.parse(localStorage.getItem('ipa_reports_archive')||'[]')[0]);
      const answers = (report && report.answers) || [];
      if (!answers.length) {
        out.innerHTML = '<div class="card-app"><div class="card-body">Complete an interview first (use the mic for best signal).</div></div>';
      } else {
        const text = answers.map(a => a.answer || '').join(' ');
        const words = text.trim().split(/\s+/).filter(Boolean);
        const durationSec = (report.duration || Math.max(60, words.length * 0.4));
        const wpm = Math.round((words.length / durationSec) * 60);
        const fillers = (text.match(/\b(um|uh|like|basically|you know|actually|sort of|kind of)\b/gi) || []);
        const fillerRate = words.length ? Math.round((fillers.length / words.length) * 1000) / 10 : 0;
        const conf = Math.max(35, Math.min(95, 70 + Math.round((report.overallScore || 60) - 60) - fillerRate * 2));
        const paceLabel = wpm < 110 ? 'Slow — pick up energy slightly' : wpm > 160 ? 'Fast — pause between ideas' : 'Good conversational pace';
        out.innerHTML = `
          <div class="row g-3 mb-3">
            <div class="col-md-3"><div class="stat-card"><div class="stat-value">${wpm}</div><div class="stat-label">Est. WPM</div></div></div>
            <div class="col-md-3"><div class="stat-card"><div class="stat-value">${fillers.length}</div><div class="stat-label">Filler words</div></div></div>
            <div class="col-md-3"><div class="stat-card"><div class="stat-value">${fillerRate}%</div><div class="stat-label">Filler rate</div></div></div>
            <div class="col-md-3"><div class="stat-card"><div class="stat-value">${conf}</div><div class="stat-label">Confidence index</div></div></div>
          </div>
          <div class="card-app mb-3"><div class="card-body">
            <h6 class="fw-bold">Pace coach</h6>
            <p class="mb-1">${paceLabel} (target ~120–150 WPM for interviews).</p>
            <p class="text-muted small mb-0">Fillers found: ${fillers.length ? fillers.slice(0,12).join(', ') : 'none detected in text'}.</p>
          </div></div>
          <div class="card-app"><div class="card-body">
            <h6 class="fw-bold mb-2">Per-answer length</h6>
            ${answers.map((a,i)=>`<div class="d-flex justify-content-between border-bottom py-2 small" style="border-color:var(--border)!important"><span>Q${i+1}</span><span>${(a.answer||'').split(/\s+/).filter(Boolean).length} words · score ${a.score}</span></div>`).join('')}
          </div></div>`;
      }
    }
  </script>
  <script src="../../assets/js/global-loader.js"></script>
</body>
</html>
