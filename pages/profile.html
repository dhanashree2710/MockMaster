<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile — MockMaster</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../assets/css/variables.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
  <link href="../assets/css/responsive.css" rel="stylesheet">
  <link href="../assets/css/loader.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar-app">
    <a href="dashboard.html" class="navbar-brand-app"><img src="../assets/images/mockmaster-logo.png" alt="MockMaster" class="brand-logo-img"> MockMaster</a>
    <div class="navbar-actions"><button class="btn-ghost" data-theme-toggle><i class="bi bi-moon-stars"></i></button></div>
  </nav>
  <main class="main-content">
    <div class="page-content" style="max-width:600px;">
      <div class="page-header"><h1>Profile</h1></div>
      <div class="card-app">
        <div class="card-body">
          <div class="mb-3">
            <label class="form-label-app">Full Name</label>
            <input type="text" class="form-control form-control-app" id="name" data-user-name>
          </div>
          <div class="mb-3">
            <label class="form-label-app">Email</label>
            <input type="email" class="form-control form-control-app" id="email">
          </div>
          <button class="btn-primary-app" id="saveBtn">Save Changes</button>
        </div>
      </div>
    </div>
  </main>
    <nav class="bottom-nav" aria-label="Mobile navigation">
    <div class="dock-bead" aria-hidden="true"><i class="bi bi-grid-1x2"></i></div>
    <a href="dashboard.html" aria-label="Home"><i class="bi bi-grid-1x2"></i><span>Home</span></a><a href="resume/upload-resume.html" aria-label="Resume"><i class="bi bi-file-earmark-person"></i><span>Resume</span></a><a href="interview/interview-setup.html" aria-label="Interview"><i class="bi bi-mic"></i><span>Interview</span></a><a href="progress.html" aria-label="Progress"><i class="bi bi-graph-up"></i><span>Progress</span></a><a href="profile.html" class="active" aria-label="Profile"><i class="bi bi-person"></i><span>Profile</span></a>
  </nav>

  <footer class="site-footer">
    <span>© 2026 <span class="brand-name">MockMaster</span>. All Rights Reserved.</span>
    <span class="footer-sep">|</span>
    <span>Design by <span class="designer-name">KDRT IT Solutions LLP</span></span>
  </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/supabase-client.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/firebase.js"></script>
  <script src="../assets/js/theme.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
    const u = Utils.getUser();
    document.getElementById('name').value = u.name || '';
    document.getElementById('email').value = u.email || '';
    document.getElementById('saveBtn').addEventListener('click', () => {
      Utils.setStored(STORAGE_KEYS.user, { name: document.getElementById('name').value, email: document.getElementById('email').value });
      Utils.showToast('Profile saved', 'success');
    });
  </script>
  <script src="../assets/js/auth-guard.js"></script>
  <script src="../assets/js/global-loader.js"></script>
</body>
</html>
