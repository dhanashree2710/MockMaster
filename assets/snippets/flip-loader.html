<!-- Hourglass loader snippet
     Include: <link href="assets/css/loader.css" rel="stylesheet">
-->
<div class="hourglass-loader" role="status" aria-label="Loading">
  <span class="hg-cap-top"></span>
  <span class="hg-neck"></span>
  <span class="hg-cap-bottom"></span>
</div>

<!-- Full-page overlay (or use MockMasterLoader.show / hide) -->
<div class="hourglass-loader-overlay" id="globalLoader">
  <div class="hourglass-loader" role="status" aria-label="Loading">
    <span class="hg-cap-top"></span>
    <span class="hg-neck"></span>
    <span class="hg-cap-bottom"></span>
  </div>
  <p class="loader-caption">Loading</p>
</div>
